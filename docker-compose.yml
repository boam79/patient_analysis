version: '3.8'

services:
  # 병원 CRM Application
  # 참고: 인증/제작자 페이지/로그는 Supabase(PostgreSQL)를 사용합니다.
  # 로컬 PostgreSQL 컨테이너는 더 이상 필요하지 않습니다 (NextAuth+Prisma 스택 제거, v4.6).
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hospital-crm
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - NOMINATIM_API_URL=${NOMINATIM_API_URL:-https://nominatim.openstreetmap.org/search}
      - NOMINATIM_USER_AGENT=${NOMINATIM_USER_AGENT:-Hospital-CRM/1.0}
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    networks:
      - pdr-network

  # Nginx Reverse Proxy (Optional)
  nginx:
    image: nginx:alpine
    container_name: pdr-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - pdr-network

networks:
  pdr-network:
    driver: bridge

