version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: pdr-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pdr_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pdr_password}
      POSTGRES_DB: ${POSTGRES_DB:-pdr_dashboard}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./prisma/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pdr_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pdr-network

  # PDR Dashboard Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pdr-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-pdr_user}:${POSTGRES_PASSWORD:-pdr_password}@postgres:5432/${POSTGRES_DB:-pdr_dashboard}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NOMINATIM_API_URL=${NOMINATIM_API_URL:-https://nominatim.openstreetmap.org/search}
      - NOMINATIM_USER_AGENT=${NOMINATIM_USER_AGENT:-PDR-Dashboard/1.0}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    networks:
      - pdr-network

  # Nginx Reverse Proxy (Optional)
  nginx:
    image: nginx:alpine
    container_name: pdr-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - pdr-network

volumes:
  postgres_data:
    driver: local

networks:
  pdr-network:
    driver: bridge

